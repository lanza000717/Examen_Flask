{% extends "base.html" %}
{% block titulo %}Ejercicio 2{% endblock %}
{% block contenido %}
<div class="tarjeta">
    <h1>Inicio de sesión</h1>
    <form method="POST" action="{{ url_for('ejercicio2') }}">
        <label for="usuario">Ingresa tu nombre</label>
        <input type="text" id="usuario" name="usuario" value="{{ request.form.get('usuario', '') }}" required>

        <label for="clave">Ingresa tu contraseña</label>
        <input type="password" id="clave" name="clave" required>

        <button type="submit">Verificar</button>
    </form>

    {% if mensaje %}
        <div class="resultado">
            <p>{{ mensaje }}</p>
        </div>
    {% endif %}

    <a class="volver" href="{{ url_for('inicio') }}">← Volver al menú</a>
</div>
{% endblock %}
